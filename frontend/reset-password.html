<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Nova Senha</h2>
            <p class="text-gray-500 text-sm">Digite sua nova senha abaixo.</p>
        </div>
        
        <form id="reset-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nova Senha</label>
                <input type="password" id="new-password" placeholder="******" required class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700 transition">Salvar Nova Senha</button>
        </form>
        
        <p id="msg" class="mt-4 text-center text-sm font-bold"></p>
    </div>

    <script>
        // Use o mesmo IP configurado no seu server.js e index.js
        const API_URL = 'http://192.168.8.11:3000';
        
        // Pega o token que veio na URL (ex: reset-password.html?token=xyz...)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const msg = document.getElementById('msg');
            
            if(!token) {
                msg.className = 'text-red-500';
                msg.textContent = 'Token inválido ou ausente na URL.';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                
                const data = await res.json();
                
                if(res.ok) {
                    alert('Senha alterada com sucesso! Faça login com a nova senha.');
                    window.location.href = 'login.html';
                } else {
                    msg.className = 'text-red-500';
                    msg.textContent = data.message;
                }
            } catch(err) {
                msg.className = 'text-red-500';
                msg.textContent = 'Erro ao conectar ao servidor.';
            }
        });
    </script>
</body>
</html>
