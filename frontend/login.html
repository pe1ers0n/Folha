<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Folha</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
        <div class="text-center mb-6">
            <img src="https://i.postimg.cc/c4m065zS/logo-Tijuca.png" alt="Logo" class="h-12 mx-auto mb-4">
            <h2 class="text-2xl font-bold text-gray-800">Acesso ao Sistema</h2>
        </div>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">E-mail</label>
                <input type="email" id="email" required class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-600 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Senha</label>
                <input type="password" id="password" required class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-600 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-800 text-white font-bold py-2 rounded hover:bg-blue-900 transition">Entrar</button>
        </form>
        
        <div class="mt-4 text-center">
            <button id="forgot-btn" class="text-sm text-blue-600 hover:underline">Esqueci minha senha</button>
        </div>
        <p id="msg" class="mt-4 text-center text-sm font-bold"></p>
    </div>

    <script>
        // Use o mesmo IP configurado no seu server.js e index.js
        const API_URL = 'http://192.168.8.11:3000'; 

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');

            msg.textContent = 'Autenticando...';
            msg.className = 'mt-4 text-center text-sm font-bold text-gray-600';

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();

                if (res.ok) {
                    // Salva o token e redireciona
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    msg.className = 'mt-4 text-center text-sm font-bold text-red-500';
                    msg.textContent = data.message || 'Falha no login.';
                }
            } catch (err) {
                msg.className = 'mt-4 text-center text-sm font-bold text-red-500';
                msg.textContent = 'Erro ao conectar ao servidor.';
                console.error(err);
            }
        });

        document.getElementById('forgot-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = prompt("Digite seu e-mail para receber o link de recuperação:");
            if(email) {
                try {
                    const res = await fetch(`${API_URL}/auth/forgot-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();
                    alert(data.message);
                } catch(err) { 
                    alert('Erro de conexão ao tentar recuperar senha.'); 
                }
            }
        });
    </script>
</body>
</html>
